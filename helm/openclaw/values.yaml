# Default values for OpenClaw Helm chart
# This file is the base configuration

## Global settings
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  domain: openclaw.example.com
  
  # Service mesh
  serviceMesh:
    enabled: true
    
  # Logging
  logging:
    level: info
    format: json
    
  # Monitoring
  monitoring:
    enabled: true
    prometheus:
      scrapeInterval: 30s

## API Gateway Configuration
apiGateway:
  enabled: true
  replicaCount: 3
  
  image:
    repository: openclaw/api-gateway
    tag: latest
    pullPolicy: Always
    
  service:
    type: LoadBalancer
    port: 80
    httpsPort: 443
    
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    
  healthCheck:
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
    readiness:
      path: /ready
      initialDelaySeconds: 10
      periodSeconds: 5

## Control Plane (ACP Server)
controlPlane:
  enabled: true
  replicaCount: 3
  
  image:
    repository: openclaw/control-plane
    tag: latest
    pullPolicy: Always
    
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
      
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    
  redis:
    url: "redis://redis-master:6379"

## Channel Services
channels:
  enabled: true
  
  discord:
    enabled: true
    replicaCount: 2
    
  telegram:
    enabled: true
    replicaCount: 2
    
  slack:
    enabled: true
    replicaCount: 2
    
  whatsapp:
    enabled: true
    replicaCount: 2
    persistence:
      enabled: true
      size: 10Gi
      
  # Common channel settings
  defaults:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 20

## Agent Runtime
agentRuntime:
  enabled: true
  replicaCount: 3
  
  image:
    repository: openclaw/agent-runtime
    tag: latest
    pullPolicy: Always
    
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
      
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    
  workspace:
    emptyDir: {}

## Plugin Registry
pluginRegistry:
  enabled: true
  replicaCount: 2
  
  image:
    repository: openclaw/plugin-registry
    tag: latest
    pullPolicy: Always
    
  persistence:
    enabled: true
    size: 20Gi
    storageClass: standard
    
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

## Redis (for message queue and caching)
redis:
  enabled: true
  
  master:
    replicaCount: 1
    persistence:
      enabled: true
      size: 10Gi
      
  replica:
    replicaCount: 2
    
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

## Monitoring
monitoring:
  enabled: true
  
  prometheus:
    enabled: true
    retention: 15d
    storageSize: 50Gi
    
  grafana:
    enabled: true
    adminPassword: admin
    
  loki:
    enabled: true
    persistence:
      enabled: true
      size: 50Gi
      
  jaeger:
    enabled: true

## Ingress
ingress:
  enabled: true
  className: nginx
  
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    
  hosts:
    - host: gateway.openclaw.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 18789

  tls:
    - secretName: openclaw-tls
      hosts:
        - gateway.openclaw.example.com

## Network Policies
networkPolicies:
  enabled: true

## Pod Disruption Budgets
podDisruptionBudgets:
  enabled: true

## Resource Quotas
resourceQuotas:
  enabled: true
  requests:
    cpu: "32"
    memory: 64Gi
  limits:
    cpu: "64"
    memory: 128Gi

## Security
security:
  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    
  # Container security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
