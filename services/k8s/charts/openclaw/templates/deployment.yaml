{{- $root := . -}}
{{- $svc := .service -}}
{{- $fullName := printf "%s-%s" $root.Release.Name $svc.name -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $fullName }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/version: {{ $svc.image.tag | default $root.Chart.AppVersion }}
    app.kubernetes.io/component: {{ $svc.component | default "microservice" }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $svc.name }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $svc.name }}
        app.kubernetes.io/name: {{ $fullName }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ $svc.service.port }}"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ $fullName }}-sa
      securityContext:
        {{- toYaml $root.Values.global.securityContext | nindent 8 }}
      containers:
      - name: {{ $svc.name }}
        image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
        imagePullPolicy: {{ $svc.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: {{ $svc.service.port }}
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- if $svc.env }}
        {{- range $key, $value := $svc.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- if $root.Values.global.env }}
        {{- range $key, $value := $root.Values.global.env }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: {{ $svc.livenessProbe.path | default "/health" }}
            port: http
          initialDelaySeconds: {{ $svc.livenessProbe.initialDelaySeconds | default 30 }}
          periodSeconds: {{ $svc.livenessProbe.periodSeconds | default 10 }}
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: {{ $svc.readinessProbe.path | default "/ready" }}
            port: http
          initialDelaySeconds: {{ $svc.readinessProbe.initialDelaySeconds | default 10 }}
          periodSeconds: {{ $svc.readinessProbe.periodSeconds | default 5 }}
          timeoutSeconds: 3
          failureThreshold: 3
        {{- if $svc.resources }}
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $svc.name }}
    app.kubernetes.io/name: {{ $fullName }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
spec:
  type: {{ $svc.service.type | default "ClusterIP" }}
  ports:
  - port: {{ $svc.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: {{ $svc.name }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullName }}-sa
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $svc.name }}
---
{{- if $svc.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $fullName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $svc.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $fullName }}
  minReplicas: {{ $svc.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ $svc.autoscaling.maxReplicas | default 10 }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ $svc.autoscaling.targetCPUUtilizationPercentage | default 70 }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ $svc.autoscaling.targetMemoryUtilizationPercentage | default 80 }}
{{- end }}
