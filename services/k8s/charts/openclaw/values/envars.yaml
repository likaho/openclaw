# Environment Variables Configuration
# This file defines all environment variables for OpenClaw microservices

# ============================================================================
# GLOBAL ENVARS (shared across all services)
# ============================================================================

# Application
LOG_LEVEL: info                    # Log level: trace, debug, info, warn, error
NODE_ENV: production              # Environment: development, production
APP_VERSION: "2026.2.26"         # Application version

# Redis Configuration
REDIS_HOST: redis-master          # Redis hostname
REDIS_PORT: "6379"               # Redis port
REDIS_PASSWORD: ""               # Redis password (set via secret)
REDIS_DB: "0"                    # Redis database number
REDIS_CLUSTER_NODES: ""          # Comma-separated cluster nodes

# Kafka Configuration
KAFKA_BROKERS: kafka-headless:9092  # Kafka broker addresses
KAFKA_CLIENT_ID: openclaw        # Kafka client ID
KAFKA_GROUP_ID: openclaw-group   # Kafka consumer group ID
KAFKA_SECURITY_PROTOCOL: PLAINTEXT  # Kafka security protocol

# Service Discovery
SERVICE_REGISTRY_URL: ""         # Consul/etcd service registry URL
SERVICE_HEALTH_CHECK_INTERVAL: "10s"

# Observability
OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
OTEL_SERVICE_NAME: ""             # Set per-service
METRICS_ENABLED: "true"
TRACING_ENABLED: "true"

# ============================================================================
# API GATEWAY ENVARS
# ============================================================================

# Server
API_GATEWAY_PORT: "3000"
API_GATEWAY_HOST: "0.0.0.0"
API_GATEWAY_REQUEST_TIMEOUT: "30000"

# Rate Limiting
RATE_LIMIT_ENABLED: "true"
RATE_LIMIT_WINDOW_MS: "60000"
RATE_LIMIT_MAX_REQUESTS: "100"

# CORS
CORS_ORIGIN: "*"
CORS_CREDENTIALS: "true"

# Authentication
JWT_SECRET: ""                    # Set via secret
JWT_EXPIRY: "24h"

# ============================================================================
# CONTROL PLANE (ACP SERVER) ENVARS
# ============================================================================

ACP_SERVER_PORT: "8080"
ACP_SERVER_HOST: "0.0.0.0"

# ACP Protocol
ACP_MAX_MESSAGE_SIZE: "10485760"  # 10MB
ACP_HEARTBEAT_INTERVAL: "30000"
ACP_SESSION_TIMEOUT: "300000"

# Agent Management
AGENT_MAX_CONCURRENT: "10"
AGENT_EXECUTION_TIMEOUT: "300000"

# ============================================================================
# SESSION MANAGER ENVARS
# ============================================================================

SESSION_MANAGER_PORT: "3001"
SESSION_CLEANUP_INTERVAL: "300000"
SESSION_MAX_AGE: "86400000"       # 24 hours in ms
SESSION_STORAGE_MODE: redis       # redis or memory

# ============================================================================
# AGENT RUNTIME ENVARS
# ============================================================================

AGENT_RUNTIME_PORT: "3002"
AGENT_RUNTIME_HOST: "0.0.0.0"

# Execution
AGENT_WORKER_POOL_SIZE: "5"
AGENT_MAX_RETRIES: "3"
AGENT_RETRY_DELAY: "1000"

# ACP Connection
ACP_SERVER_URL: "http://control-plane:8080"
AGENT_HEARTBEAT_INTERVAL: "30000"

# Model Providers
DEFAULT_MODEL_PROVIDER: openai
OPENAI_API_KEY: ""                # Set via secret
ANTHROPIC_API_KEY: ""             # Set via secret

# ============================================================================
# CHANNEL SERVICES COMMON ENVARS
# ============================================================================

# Message Queue
MESSAGE_QUEUE_ENABLED: "true"
MESSAGE_QUEUE_TOPIC_PREFIX: "openclaw"

# Outbound HTTP
HTTP_CLIENT_TIMEOUT: "30000"
HTTP_CLIENT_MAX_REDIRECTS: "3"

# Webhooks
WEBHOOK_VERIFY_TOKEN: ""          # Set via secret

# ============================================================================
# DISCORD CHANNEL ENVARS
# ============================================================================

DISCORD_BOT_TOKEN: ""             # Set via secret
DISCORD_GUILD_ID: ""
DISCORD_INTENTS: "32768"          # GUILD_MESSAGES, DIRECT_MESSAGES

# Discord-specific
DISCORD_MAX_MESSAGE_LENGTH: "2000"
DISCORD_RATE_LIMIT_DELAY: "1000"

# ============================================================================
# TELEGRAM CHANNEL ENVARS
# ============================================================================

TELEGRAM_BOT_TOKEN: ""            # Set via secret
TELEGRAM_API_URL: "https://api.telegram.org"
TELEGRAM_WEBHOOK_PATH: "/webhook"
TELEGRAM_LONG_POLLING_TIMEOUT: "60"

# ============================================================================
# SLACK CHANNEL ENVARS
# ============================================================================

SLACK_BOT_TOKEN: ""               # Set via secret
SLACK_SIGNING_SECRET: ""          # Set via secret
SLACK_APP_TOKEN: ""               # Set via secret
SLACK_SOCKET_MODE: "true"

# Slack-specific
SLACK_MAX_MESSAGE_LENGTH: "30000"
SLACK_RATE_LIMIT_DELAY: "1000"

# ============================================================================
# WHATSAPP CHANNEL ENVARS
# ============================================================================

WHATSAPP_PHONE_NUMBER_ID: ""      # Set via secret
WHATSAPP_ACCESS_TOKEN: ""         # Set via secret
WHATSAPP_WEBHOOK_VERIFY_TOKEN: "" # Set via secret
WHATSAPP_API_VERSION: "v18.0"

# WhatsApp-specific
WHATSAPP_MESSAGE_TEMPLATE: "orchestrator"
WHATSAPP_MAX_MEDIA_SIZE: "16777216"  # 16MB
