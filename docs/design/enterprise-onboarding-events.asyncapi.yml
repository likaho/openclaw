asyncapi: 2.6.0
info:
  title: OpenClaw Enterprise Onboarding Events
  version: 0.1.0
channels:
  onboarding.user.created:
    publish:
      operationId: onboardingUserCreated
      message:
        payload:
          type: object
          required: [eventType, occurredAt, payload]
          properties:
            eventType:
              type: string
              enum: [onboarding.user.created]
            occurredAt:
              type: string
            payload:
              type: object
