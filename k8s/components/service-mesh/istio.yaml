# Istio Service Mesh Configuration for OpenClaw
# Install Istio first: istioctl install

apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-openclaw
  namespace: istio-system
data:
  mesh: |-
    # Enable Istio features
    enableAutoMtls: true
    enableTracing: true
    enablePrometheusMerge: true
    
    # Default settings
    defaultConfig:
      # Tracing
      tracing:
        sampling: 10
        maxPathTagLength: 200
        
      # Proxy resources
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 2000m
          memory: 1024Mi
          
      # Readiness probe
      readinessProbe:
        initialDelaySeconds: 1
        periodSeconds: 2
        failureThreshold: 3
        
      # Lifecycle
      lifecycle:
        preStop:
          exec:
            command: ["/bin/sh", "-c", "sleep 10"]
            
      # Mesh ID for telemetry
      meshId: openclaw-mesh
      
    # Extension providers
    extensionProviders:
    - name: prometheus
      prometheus:
        metricsPath: /metrics
        port: 9090
        
    - name: jaeger
      jaeger:
        service:
          name: jaeger-collector.observability.svc
          port: 14268
          
    - name: cloudwatch
      cloudwatch:
        logGroup: /aws/istio/openclaw
        region: us-east-1
        
    # Access log
    accessLogFile: /dev/stdout
    accessLogFormat: '{"start_time":"%START_TIME%","remote_address":"%DOWNSTREAM_REMOTE_ADDRESS%","user_agent":"%HTTP_REQUEST_USER_AGENT%","method":"%REQ(:METHOD)%","path":"%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%","protocol":"%PROTOCOL%","response_code":"%RESPONSE_CODE%","response_flags":"%RESPONSE_FLAGS%","response_code_details":"%RESPONSE_CODE_DETAILS%","connection_termination_details":"%CONNECTION_TERMINATION_DETAILS%","upstream_transport_failure_reason":"%UPSTREAM_TRANSPORT_FAILURE_REASON%","duration":"%DURATION%","upstream_service_time":"%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%","upstream_host":"%UPSTREAM_HOST%","upstream_cluster":"%UPSTREAM_CLUSTER%","downstream_local_address":"%DOWNSTREAM_LOCAL_ADDRESS%","upstream_local_address":"%UPSTREAM_LOCAL_ADDRESS%","downstream_remote_address":"%DOWNSTREAM_REMOTE_ADDRESS%","requested_server_name":"%REQUESTED_SERVER_NAME%","route_name":"%ROUTE_NAME%"}'

---
# DestinationRules for OpenClaw services
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway
  namespace: openclaw
spec:
  host: api-gateway.openclaw.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
    circuitBreaker:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: control-plane
  namespace: openclaw
spec:
  host: control-plane.openclaw.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 50
        http2MaxRequests: 500
    circuitBreaker:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    tls:
      mode: ISTIO_MUTUAL

---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: agent-runtime
  namespace: openclaw
spec:
  host: agent-runtime.openclaw.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        h2UpgradePolicy: UPGRADE
        http1MaxPendingRequests: 100
        http2MaxRequests: 1000
        maxRequestsPerConnection: 50
    circuitBreaker:
      consecutive5xxErrors: 3
      interval: 20s
      baseEjectionTime: 20s
      maxEjectionPercent: 30
    tls:
      mode: ISTIO_MUTUAL

---
# VirtualServices for routing
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
  namespace: openclaw
spec:
  hosts:
  - api-gateway
  - api-gateway.openclaw.svc.cluster.local
  http:
  - match:
    - uri:
        prefix: /health
    route:
    - destination:
        host: api-gateway
        port:
          number: 18789
    retries:
      attempts: 3
      perTryTimeout: 5s
  - route:
    - destination:
        host: api-gateway
        port:
          number: 18789
    timeout: 60s
    retries:
      attempts: 3
      perTryTimeout: 10s
      retryOn: 5xx,reset,connect-failure,retriable-4xx

---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: control-plane
  namespace: openclaw
spec:
  hosts:
  - control-plane
  - control-plane.openclaw.svc.cluster.local
  http:
  - route:
    - destination:
        host: control-plane
        port:
          number: 3000
    timeout: 120s
    retries:
      attempts: 2
      perTryTimeout: 30s

---
# Authorization policies (mTLS + JWT)
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-gateway-authz
  namespace: openclaw
spec:
  selector:
    matchLabels:
      app: api-gateway
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/openclaw-channels/sa/channel-sa"]
    - source:
        principals: ["cluster.local/ns/openclaw/sa/control-plane-sa"]
    - source:
        principals: ["cluster.local/ns/istio-system/istio-ingress-service-account"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: control-plane-authz
  namespace: openclaw
spec:
  selector:
    matchLabels:
      app: control-plane
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/openclaw/sa/api-gateway-sa"]
    - source:
        principals: ["cluster.local/ns/openclaw/sa/agent-runtime-sa"]
    - source:
        principals: ["cluster.local/ns/openclaw-channels/sa/channel-sa"]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: agent-runtime-authz
  namespace: openclaw
spec:
  selector:
    matchLabels:
      app: agent-runtime
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/openclaw/sa/control-plane-sa"]
