apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-registry
  namespace: openclaw
  labels:
    app: plugin-registry
    component: plugins
spec:
  replicas: 2
  selector:
    matchLabels:
      app: plugin-registry
  template:
    metadata:
      labels:
        app: plugin-registry
        component: plugins
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: plugin-registry-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: plugin-registry
        image: openclaw/plugin-registry:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "plugin-registry"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: openclaw-config
              key: REDIS_URL
        envFrom:
        - configMapRef:
            name: openclaw-config
        - secretRef:
            name: openclaw-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: plugin-storage
          mountPath: /app/plugins
      volumes:
      - name: plugin-storage
        persistentVolumeClaim:
          claimName: plugin-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: plugin-registry
  namespace: openclaw
  labels:
    app: plugin-registry
    component: plugins
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: plugin-registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plugin-storage-pvc
  namespace: openclaw
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
