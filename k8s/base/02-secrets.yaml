# NOTE: This file should be encrypted at rest using SealedSecrets or Vault
# Do not commit unencrypted secrets to version control

apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw
type: Opaque
stringData:
  # Gateway authentication
  OPENCLAW_GATEWAY_TOKEN: "CHANGE_ME_IN_PRODUCTION"
  
  # Provider API keys (per environment)
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_AI_API_KEY: ""
  
  # Channel credentials (per channel)
  DISCORD_BOT_TOKEN: ""
  TELEGRAM_BOT_TOKEN: ""
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""
  SIGNAL_USERNAME: ""
  WHATSAPP_SESSION_PATH: ""
  
  # Database
  POSTGRES_PASSWORD: ""
  REDIS_PASSWORD: ""
  
  # Encryption
  ENCRYPTION_KEY: ""
  
  # External services
  SENTRY_DSN: ""
  DATADOG_API_KEY: ""
