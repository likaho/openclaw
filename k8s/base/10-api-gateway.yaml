apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: openclaw
  labels:
    app: api-gateway
    component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "18789"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: api-gateway-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api-gateway
        image: openclaw/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 18789
          protocol: TCP
        - name: ws
          containerPort: 18790
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SERVICE_NAME
          value: "api-gateway"
        envFrom:
        - configMapRef:
            name: openclaw-config
        - secretRef:
            name: openclaw-secrets
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 18789
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 18789
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: session-storage
          mountPath: /app/sessions
      volumes:
      - name: config
        configMap:
          name: openclaw-config
      - name: session-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: openclaw
  labels:
    app: api-gateway
    component: gateway
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 18789
    targetPort: 18789
    protocol: TCP
  - name: ws
    port: 18790
    targetPort: 18790
    protocol: TCP
  selector:
    app: api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-lb
  namespace: openclaw
  labels:
    app: api-gateway
    component: gateway
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 18789
    protocol: TCP
  - name: https
    port: 443
    targetPort: 18789
    protocol: TCP
  selector:
    app: api-gateway
