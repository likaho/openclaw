# Network Policies for OpenClaw Microservices
# These policies define which services can communicate with each other

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-network-policy
  namespace: openclaw
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: istio-ingressgateway
    ports:
    - protocol: TCP
      port: 18789
  - from:
    - podSelector:
        matchLabels:
          app: control-plane
    ports:
    - protocol: TCP
      port: 18789
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: control-plane
    ports:
    - protocol: TCP
      port: 3000
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-network-policy
  namespace: openclaw
spec:
  podSelector:
    matchLabels:
      app: control-plane
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    - podSelector:
        matchLabels:
          app: agent-runtime
    - podSelector:
        matchLabels:
          app: channel-discord
    - podSelector:
        matchLabels:
          app: channel-telegram
    - podSelector:
        matchLabels:
          app: channel-slack
    - podSelector:
        matchLabels:
          app: channel-whatsapp
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: agent-runtime
    ports:
    - protocol: TCP
      port: 3000

---
# Channel services can only communicate with control plane and redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: channel-services-network-policy
  namespace: openclaw-channels
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: openclaw
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: openclaw
      podSelector:
        matchLabels:
          app: control-plane
    ports:
    - protocol: TCP
      port: 3000
  - to:
    - namespaceSelector:
        matchLabels:
          name: openclaw-system
      podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runtime-network-policy
  namespace: openclaw
spec:
  podSelector:
    matchLabels:
      app: agent-runtime
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: control-plane
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: control-plane
    ports:
    - protocol: TCP
      port: 3000
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow external API calls for LLM providers
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plugin-registry-network-policy
  namespace: openclaw
spec:
  podSelector:
    matchLabels:
      app: plugin-registry
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    - podSelector:
        matchLabels:
          app: control-plane
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow npm registry access
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
