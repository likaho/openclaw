apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
data:
  # Service URLs
  API_GATEWAY_URL: "http://api-gateway.openclaw:18789"
  CONTROL_PLANE_URL: "http://control-plane.openclaw:3000"
  AGENT_RUNTIME_URL: "http://agent-runtime.openclaw:3000"
  PLUGIN_REGISTRY_URL: "http://plugin-registry.openclaw:3000"
  CONFIG_SERVICE_URL: "http://config-service.openclaw:3000"
  
  # Redis configuration
  REDIS_URL: "redis://redis-master.openclaw-system:6379"
  REDIS_CLUSTER_URLS: "redis://redis-cluster.openclaw-system:6379"
  
  # Message queue
  MESSAGE_QUEUE_URL: "redis://redis-master.openclaw-system:6379"
  
  # Service mesh
  SERVICE_MESH_ENABLED: "true"
  
  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  
  # Health check
  HEALTH_CHECK_INTERVAL: "30s"
  
  # Feature flags
  ENABLE_TRACING: "true"
  ENABLE_METRICS: "true"
  ENABLE_RATE_LIMITING: "true"
