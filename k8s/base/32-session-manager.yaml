apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-manager
  namespace: openclaw
  labels:
    app: session-manager
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: session-manager
  template:
    metadata:
      labels:
        app: session-manager
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: openclaw
      containers:
        - name: session-manager
          image: openclaw/session-manager:2026.2.26
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: redis.url
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: openclaw-config
                  key: kafka.brokers
            - name: SESSION_TTL
              value: "3600"
            - name: LOG_LEVEL
              value: "info"
          envFrom:
            - secretRef:
                name: openclaw-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: session-manager
  namespace: openclaw
  labels:
    app: session-manager
spec:
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: session-manager
  clusterIP: None
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: session-manager
  namespace: openclaw
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: session-manager
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
