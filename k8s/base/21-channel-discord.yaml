apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-discord
  namespace: openclaw-channels
  labels:
    app: channel-discord
    component: channel
    channel: discord
spec:
  replicas: 2
  selector:
    matchLabels:
      app: channel-discord
  template:
    metadata:
      labels:
        app: channel-discord
        component: channel
        channel: discord
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: channel-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: channel-discord
        image: openclaw/channel-discord:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: SERVICE_NAME
          value: "channel-discord"
        - name: CHANNEL_TYPE
          value: "DISCORD"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: openclaw-config
              key: REDIS_URL
        - name: CONTROL_PLANE_URL
          valueFrom:
            configMapKeyRef:
              name: openclaw-config
              key: CONTROL_PLANE_URL
        - name: MESSAGE_QUEUE
          value: "discord:inbound"
        envFrom:
        - configMapRef:
            name: openclaw-config
        - secretRef:
            name: openclaw-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: session-storage
          mountPath: /app/sessions
      volumes:
      - name: session-storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: channel-discord
  namespace: openclaw-channels
  labels:
    app: channel-discord
    component: channel
    channel: discord
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: channel-discord
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: channel-discord-hpa
  namespace: openclaw-channels
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: channel-discord
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: channel-discord-pdb
  namespace: openclaw-channels
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: channel-discord
