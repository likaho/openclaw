---
# Agent Runtime Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runtime-sa
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runtime-role
  namespace: openclaw
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runtime-rb
  namespace: openclaw
subjects:
- kind: ServiceAccount
  name: agent-runtime-sa
  namespace: openclaw
roleRef:
  kind: Role
  name: agent-runtime-role
  apiGroup: rbac.authorization.k8s.io

---
# Plugin Registry Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plugin-registry-sa
  namespace: openclaw
