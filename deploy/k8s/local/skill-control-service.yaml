apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-control-service
  namespace: openclaw-local
  labels:
    app: skill-control-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skill-control-service
  template:
    metadata:
      labels:
        app: skill-control-service
    spec:
      containers:
        - name: skill-control-service
          image: openclaw/skill-control-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4006
          env:
            - name: PORT
              value: "4006"
            - name: SKILL_SIGNATURE_KEY
              value: "local-skill-signature-key"
---
apiVersion: v1
kind: Service
metadata:
  name: skill-control-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: skill-control-service
  ports:
    - name: http
      port: 4006
      targetPort: 4006
