apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-control-service
  namespace: openclaw-local
  labels:
    app: skill-control-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: skill-control-service
  template:
    metadata:
      labels:
        app: skill-control-service
    spec:
      containers:
        - name: skill-control-service
          image: openclaw/skill-control-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 4006
          env:
            - name: PORT
              value: "4006"
            - name: SKILL_SIGNATURE_KEY
              value: "local-skill-signature-key"
          readinessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4006
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skill-control-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: skill-control-service
  ports:
    - name: http
      port: 4006
      targetPort: 4006