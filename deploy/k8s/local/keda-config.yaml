# KEDA Configuration for openclaw-local namespace
# Install KEDA if not already installed:
# kubectl apply -f https://kedacore.github.io/charts/keda/templates/crds.yaml
# helm repo add kedacore https://kedacore.github.io/charts
# helm install keda kedacore/keda --namespace keda --create-namespace

---
# KEDA ScaledObjects for all OpenClaw services
# Scale from 0 to 1 replica when there's traffic, scale back to 0 after 60s idle

# Identity Service
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: identity-service-scaledobject
  namespace: openclaw-local
spec:
  scaleTargetRef:
    name: identity-service
  minReplicaCount: 0
  maxReplicaCount: 3
  cooldownPeriod: 60
  triggers:
    - type: http
      metadata:
        url: http://identity-service.openclaw-local.svc.cluster.local:4001/health
        method: GET
        requestType: GET
        activationValue: "1"
      authenticationRef:
        name: identity-service-http-auth

