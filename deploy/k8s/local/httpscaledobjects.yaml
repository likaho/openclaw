# HTTPScaledObjects for OpenClaw Services
# Using the HTTP Interceptor Pattern to solve scale-from-zero deadlock
# API Version: http.keda.sh/v1alpha1
#
# Schema based on actual KEDA HTTP Add-on v1alpha1 CRD

---
# Identity Service HTTPScaledObject
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: identity-service
  namespace: openclaw-local
spec:
  hosts:
    - identity.openclaw.local
  scaleTargetRef:
    name: identity-service
    kind: Deployment
    apiVersion: apps/v1
    service: identity-service
    port: 4001
  replicas:
    min: 0
    max: 3
  scaledownPeriod: 60
  targetPendingRequests: 1

