apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-runtime-service
  namespace: openclaw-local
  labels:
    app: skill-runtime-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: skill-runtime-service
  template:
    metadata:
      labels:
        app: skill-runtime-service
    spec:
      containers:
        - name: skill-runtime-service
          image: openclaw/skill-runtime-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 4007
          env:
            - name: PORT
              value: "4007"
            - name: RUNTIME_MAX_TIMEOUT_MS
              value: "30000"
            - name: RUNTIME_MAX_MEMORY_MB
              value: "512"
            - name: RUNTIME_ALLOWED_CAPABILITIES
              value: "no-network,http-readonly,tenant-api-only"
          readinessProbe:
            httpGet:
              path: /health
              port: 4007
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4007
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: skill-runtime-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: skill-runtime-service
  ports:
    - name: http
      port: 4007
      targetPort: 4007