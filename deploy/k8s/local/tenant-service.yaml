apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: openclaw-local
  labels:
    app: tenant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
    spec:
      containers:
        - name: tenant-service
          image: openclaw/tenant-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4002
          env:
            - name: PORT
              value: "4002"
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: tenant-service
  ports:
    - name: http
      port: 4002
      targetPort: 4002
