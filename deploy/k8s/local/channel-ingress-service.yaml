apiVersion: apps/v1
kind: Deployment
metadata:
  name: channel-ingress-service
  namespace: openclaw-local
  labels:
    app: channel-ingress-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: channel-ingress-service
  template:
    metadata:
      labels:
        app: channel-ingress-service
    spec:
      containers:
        - name: channel-ingress-service
          image: openclaw/channel-ingress-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 4004
          env:
            - name: PORT
              value: "4004"
            - name: INGRESS_API_KEY
              value: "local-ingress-key"
          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: channel-ingress-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: channel-ingress-service
  ports:
    - name: http
      port: 4004
      targetPort: 4004