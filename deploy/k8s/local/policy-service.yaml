apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  namespace: openclaw-local
  labels:
    app: policy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
    spec:
      containers:
        - name: policy-service
          image: openclaw/policy-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: policy-service
  ports:
    - name: http
      port: 4003
      targetPort: 4003
