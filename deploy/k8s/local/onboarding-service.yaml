apiVersion: apps/v1
kind: Deployment
metadata:
  name: onboarding-service
  namespace: openclaw-local
  labels:
    app: onboarding-service
spec:
  replicas: 0
  selector:
    matchLabels:
      app: onboarding-service
  template:
    metadata:
      labels:
        app: onboarding-service
    spec:
      containers:
        - name: onboarding-service
          image: openclaw/onboarding-service:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          ports:
            - containerPort: 4010
          env:
            - name: PORT
              value: "4010"
            - name: ONBOARDING_DEFAULT_WORKSPACE
              value: "default"
          readinessProbe:
            httpGet:
              path: /health
              port: 4010
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4010
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: onboarding-service
  namespace: openclaw-local
spec:
  type: ClusterIP
  selector:
    app: onboarding-service
  ports:
    - name: http
      port: 4010
      targetPort: 4010